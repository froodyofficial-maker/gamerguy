<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GamerGuy — Steam Game Discovery</title>
<style>
:root{--bg:#07090e;--p:#10141c;--p2:#151a24;--line:#272e3b;--txt:#f5f7fb;--muted:#8d97aa;--a:#7d5cff;--g:#48e0a0;--y:#ffd166;--r:#ff5d73;--rad:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,#261c55 0,transparent 32%),radial-gradient(circle at -10% 30%,#0e3328 0,transparent 28%),var(--bg);color:var(--txt);font:14px Inter,system-ui,Segoe UI,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:20px 15px;border-right:1px solid var(--line);background:#080b10d9;backdrop-filter:blur(18px)}.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;padding:8px 10px 24px}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--a),#a58fff);display:grid;place-items:center;box-shadow:0 12px 32px #7d5cff44}.nav{display:grid;gap:7px}.nav button,.mobile button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:12px;text-align:left;transition:.2s}.nav button:hover,.nav button.on{background:#171c26;color:var(--txt);transform:translateX(2px)}.nav button.on{box-shadow:inset 3px 0 var(--a)}.ico{width:18px;height:18px;vertical-align:middle;margin-right:10px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sidefoot{position:absolute;bottom:18px;left:15px;right:15px;padding:12px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:11px}.top{height:70px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:0 26px;border-bottom:1px solid #272e3b99;background:#080b10c9;backdrop-filter:blur(18px)}.search{position:relative;flex:1;max-width:760px}.search input{width:100%;padding:13px 45px;border-radius:14px;border:1px solid var(--line);background:#111620;color:var(--txt);outline:0}.search input:focus{border-color:#5c4ba0;box-shadow:0 0 0 4px #7d5cff18}.search .ico{position:absolute;left:14px;top:12px;color:#778196}.kbd{position:absolute;right:10px;top:9px;border:1px solid var(--line);padding:3px 7px;border-radius:7px;color:#687286;font-size:11px}.topbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:#111620;color:var(--muted)}.main{min-width:0}.wrap{max-width:1500px;margin:auto;padding:28px 30px 70px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;padding:34px;min-height:310px;background:linear-gradient(120deg,#151a29,#0f1219 55%,#1a132c);box-shadow:0 24px 70px #0007}.hero:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-140px;top:-160px;background:#7d5cff33;filter:blur(15px);animation:orb 8s ease-in-out infinite alternate}@keyframes orb{to{transform:translate(-40px,50px) scale(1.1)}}.hero>*{position:relative;z-index:1}.eyebrow{color:#b5a8ff;font-weight:800;font-size:11px;letter-spacing:1.6px;text-transform:uppercase}.hero h1{font-size:clamp(36px,5vw,62px);line-height:.98;letter-spacing:-3px;margin:15px 0}.hero p{max-width:650px;color:#aeb7c8;font-size:16px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#171c26;color:var(--txt);padding:10px 14px;border-radius:12px;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-2px);border-color:#444c5b}.primary{background:linear-gradient(135deg,var(--a),#6546e8);border:0;box-shadow:0 10px 30px #7d5cff33}.green{color:#7df0bc;border-color:#285240;background:#10221b}.section{margin-top:32px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.head h2{margin:0;font-size:21px}.head p{margin:4px 0 0;color:var(--muted)}.status{color:var(--muted);font-size:12px}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#596174;margin-right:6px}.status.ok i{background:var(--g);box-shadow:0 0 12px #48e0a088}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#10141b;color:#aeb7c7}.chip:hover,.chip.on{color:var(--txt);border-color:#5c4ba0;background:#17132b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}.card{overflow:hidden;background:linear-gradient(180deg,#111620,#0d1016);border:1px solid var(--line);border-radius:17px;transition:.25s}.card:hover{transform:translateY(-5px);border-color:#3b4453;box-shadow:0 20px 40px #0007}.cover{aspect-ratio:460/215;position:relative;background:#171b23;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s}.card:hover img{transform:scale(1.04)}.rank,.save{position:absolute;top:9px;background:#05070bd9;border:1px solid #ffffff18}.rank{left:9px;padding:5px 8px;border-radius:8px;font-weight:900;font-size:11px}.save{right:9px;width:34px;height:34px;border-radius:10px;color:#dce2ed}.save.saved{color:var(--y)}.body{padding:13px}.title{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:11px}.tag{border:1px solid #2a313e;padding:3px 7px;border-radius:6px}.tag.sale{color:#7ef0bd;border-color:#285240}.price{margin-top:10px;font-weight:900}.old{text-decoration:line-through;color:#626c7f;font-weight:500;margin-left:6px;font-size:11px}.cardactions{display:flex;gap:7px;margin-top:11px}.cardactions .btn{flex:1;padding:8px;font-size:12px}.empty{padding:28px;border:1px dashed #333b49;border-radius:16px;text-align:center;color:var(--muted)}.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 13px;color:var(--muted)}.overlay{position:fixed;inset:0;z-index:50;background:#000b;backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:.2s}.overlay.open{opacity:1;pointer-events:auto}.drawer{position:absolute;right:0;top:0;width:min(720px,96vw);height:100%;overflow:auto;background:#0b0f15;border-left:1px solid var(--line);transform:translateX(100%);transition:.35s}.overlay.open .drawer{transform:none}.close{position:absolute;right:17px;top:17px;z-index:3}.detailhero{height:300px;position:relative;overflow:hidden}.detailhero img{width:100%;height:100%;object-fit:cover;filter:brightness(.55)}.detailhero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,#0b0f15 94%)}.detail{position:relative;margin-top:-55px;padding:0 24px 30px;z-index:2}.detail h2{font-size:32px;letter-spacing:-1.3px;margin:0 0 4px}.muted{color:var(--muted)}.features{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.feature{border:1px solid #2a323f;border-radius:9px;padding:7px 9px;font-size:12px;color:#bfc7d5}.feature.sale{color:#ffd66b;border-color:#5d4c23}.feature.good{color:#7df0bc;border-color:#285240}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#111620}.stat b{display:block}.stat small{color:var(--muted)}.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#000b;opacity:0;pointer-events:none;transition:.2s}.modal.open{opacity:1;pointer-events:auto}.box{width:min(600px,94vw);background:#0e1219;border:1px solid var(--line);border-radius:20px;padding:21px}.listrow{width:100%;display:flex;align-items:center;gap:10px;background:#111620;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:8px;text-align:left}.grow{flex:1;min-width:0}.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#131923;border:1px solid #303847;border-radius:12px;padding:12px 15px;opacity:0;transform:translateY(15px);transition:.2s}.toast.show{opacity:1;transform:none}.mobile{display:none}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;position:fixed;bottom:10px;left:10px;right:10px;z-index:30;justify-content:space-around;background:#10141deF;border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px)}.top{padding:0 13px}.wrap{padding:20px 14px 90px}.hero{padding:26px}.hero h1{letter-spacing:-2px}.kbd{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}

/* GamerGuy v3 feature styling */
.filterbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 9px}
.filterhint{color:var(--muted);font-size:12px;margin-left:8px}
.searchtools{padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#0d1118}
.queryline{min-height:22px;color:var(--muted);font-size:12px}
.querypill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid #3b315f;background:#17132a;border-radius:9px;color:#ddd7ff}
.querypill button{border:0;background:transparent;color:inherit;padding:0;display:grid;place-items:center}
.querypill .ico{margin:0;width:13px;height:13px}
.compact{align-items:center}
.top10box{margin-top:24px}
.quiet{border:0;background:transparent;color:#687286;padding:7px 0 0;font-size:11px;display:flex;align-items:center;gap:5px}
.quiet:hover{color:#aeb7c7}
.quiet .ico{margin:0;width:14px;height:14px}
.personal{display:flex;align-items:center;gap:4px;color:#9c91db;font-size:11px;margin-top:7px}
.personal .ico{margin:0;width:13px;height:13px}
.settinggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.setting{position:relative;padding:15px;border:1px solid var(--line);border-radius:14px;background:#10151e}
.setting b{display:block;margin-bottom:4px}
.setting span{color:var(--muted);font-size:12px;padding-right:50px;display:block}
.switch{position:absolute;right:14px;top:17px;width:42px;height:24px}
.switch input{display:none}
.switch span{display:block;width:42px;height:24px;border-radius:999px;background:#252c38;transition:.2s}
.switch span:after{content:"";display:block;width:18px;height:18px;margin:3px;border-radius:50%;background:#9098a8;transition:.2s}
.switch input:checked+span{background:#4b3aa2}
.switch input:checked+span:after{transform:translateX(18px);background:#fff}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{padding:19px;border:1px solid var(--line);border-radius:17px;background:#0e131b}
.panel h3{margin:0 0 6px}
.panel>label{display:block;margin:18px 0 8px;font-weight:800;font-size:12px;color:#cbd2de}
.smallchips{max-height:180px;overflow:auto;padding-right:3px}
.dangerchip.on{border-color:#713447;background:#27141c}
.settingrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #202632;color:#cbd2de}
.settingrow:last-child{border-bottom:0}
.num{width:100px;padding:9px;border-radius:9px;border:1px solid var(--line);background:#111620;color:var(--txt)}
.checks{display:grid;gap:9px;margin-top:15px;color:#aeb7c7;font-size:13px}
.checks input{accent-color:#7d5cff}
.loadingdetail{padding:70px 25px;color:var(--muted);text-align:center}
.analysis{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:14px;background:#0e131b}
.analysis h3,.reviews h3,.personalrate h3{margin:0 0 10px}
.analysisline{display:flex;gap:8px;align-items:flex-start;color:#bfc7d5;padding:7px 0}
.analysisline .ico{color:#68dca7;width:16px;height:16px;margin:0;flex:none}
.reviews{margin:20px 0}
.review{padding:12px 0;border-top:1px solid #202632}
.reviewtop{display:flex;justify-content:space-between;gap:12px;font-size:12px}
.reviewtop b{color:#7ee9b8}
.reviewtop span{color:var(--muted)}
.review p{margin:7px 0 0;color:#aeb7c7;line-height:1.5}
.personalrate{padding:16px;border:1px solid var(--line);border-radius:14px;margin:18px 0}
.stars{display:flex;gap:5px}
.rate{border:0;background:transparent;color:#4a5364;padding:4px}
.rate .ico{margin:0;width:24px;height:24px}
.rate.on{color:#ffd166}
.btn .ico{margin:0 7px 0 0;width:15px;height:15px}
.topbtn .ico{margin:0;width:18px;height:18px}
.nav button .ico,.mobile button .ico{margin:0 9px 0 0;width:16px;height:16px}
.mobile button .ico{margin:0;width:19px;height:19px}
.save .ico{margin:0;width:17px;height:17px}
.meta:empty{display:none}
@media(max-width:900px){.settings{grid-template-columns:1fr}.settinggrid{grid-template-columns:1fr}}
@media(max-width:650px){.settinggrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cardactions{flex-direction:column}.cardactions .btn{width:100%}.hero{min-height:0}.detailhero{height:240px}}
</style></head><body>
<div class="app"><aside class="side"><div class="logo"><div class="mark"><svg class="ico" viewBox="0 0 24 24"><path d="M7 14l-2 3a2.8 2.8 0 0 0 4.8 2.8l1.4-2h2.6l1.4 2A2.8 2.8 0 0 0 20 17l-2-3"/><path d="M7 14a5 5 0 0 1 10 0M8 10V7m-1.5 1.5h3M15.5 9.5h.01M18 8h.01"/></svg></div>GamerGuy</div><nav class="nav">
<button class="on" data-page="home">Home</button>
<button data-page="discover">Discover</button>
<button data-page="lists">My Lists</button>
<button data-page="wishlist">Wishlist</button>
<button data-page="alerts">Alerts</button>
<button data-page="settings">Settings</button>
</nav><div class="sidefoot"><span id="status">Connecting to Steam…</span><br><br>Recommendations, hidden games, ratings and preferences are stored in this browser.</div></aside>
<main class="main"><header class="top"><div class="search"><svg class="ico"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg><input id="q" placeholder="Search every Steam game…"><span class="kbd">CTRL K</span></div><button class="topbtn" id="bell" title="Enable alerts">Alerts</button><button class="topbtn" id="my" title="My lists">Lists</button></header><div class="wrap" id="view"></div></main></div>
<nav class="mobile"><button data-page="home">Home</button><button data-page="discover">Discover</button><button data-page="lists">Lists</button><button data-page="wishlist">Wishlist</button><button data-page="settings">Settings</button></nav>
<div class="overlay" id="overlay"><div class="drawer"><button class="topbtn close" id="x">Close</button><div id="detail"></div></div></div>
<div class="modal" id="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h2 style="margin:0">Save game</h2><button class="topbtn" id="mx">Close</button></div><p class="muted">Choose a list or create one.</p><div id="choices"></div><button class="btn primary" style="margin-top:12px" id="new">Create new list</button></div></div><div class="toast" id="toast"></div>
<script>
const EDGE='https://hlcajwtmwgrfolaokmbn.supabase.co/functions/v1/super-processor',STORE='https://store.steampowered.com/api/appdetails';
const S={page:'home',q:'',apps:[],map:new Map(),cursor:0,more:true,loading:false,details:new Map(),viewed:JSON.parse(localStorage.ggViewed||'[]'),wish:JSON.parse(localStorage.ggWish||'[]'),lists:JSON.parse(localStorage.ggLists||'{}'),watch:JSON.parse(localStorage.ggWatch||'{}'),genres:JSON.parse(localStorage.ggGenres||'{}')};
const $=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>{localStorage.ggViewed=JSON.stringify(S.viewed.slice(-80));localStorage.ggWish=JSON.stringify(S.wish);localStorage.ggLists=JSON.stringify(S.lists);localStorage.ggWatch=JSON.stringify(S.watch);localStorage.ggGenres=JSON.stringify(S.genres)};
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2400)}
function cover(id){return `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${id}/header.jpg`}
async function edge(action,extra={}){let r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,last_appid:S.cursor,...extra})});let text=await r.text();let d;try{d=JSON.parse(text)}catch{throw Error(`Backend returned invalid JSON (HTTP ${r.status})`)}if(!r.ok||d.success===false)throw Error(d.error||`Steam processor error (HTTP ${r.status})`);return d}
async function load(){if(S.loading||!S.more)return;S.loading=true;try{let d=await edge('get_app_page');(d.apps||[]).forEach(a=>{if(!a.steam_app_id||!a.name)return;if(!S.map.has(a.steam_app_id)){S.map.set(a.steam_app_id,a);S.apps.push(a)}});S.cursor=d.next_last_appid||d.last_appid||S.cursor;S.more=!!d.has_more_results;$('#status').textContent=`Steam online · ${S.apps.length.toLocaleString()} games loaded${S.more?' · more available':''}`}catch(e){$('#status').textContent='Steam connection error';toast(e.message)}S.loading=false;render()}
async function info(id){if(S.details.has(id))return S.details.get(id);try{let r=await fetch(`${STORE}?appids=${id}&l=english&cc=us`),j=await r.json(),d=j?.[id]?.data;if(!d)throw Error();S.details.set(id,d);(d.genres||[]).forEach(g=>S.genres[g.description]=(S.genres[g.description]||0)+1);save();return d}catch(e){toast('Steam details could not be loaded');return null}}
function card(a,n){let d=S.details.get(a.steam_app_id),p=d?.price_overview,sale=p?.discount_percent>0,id=a.steam_app_id,saved=S.wish.includes(id);return `<article class="card"><div class="cover"><img loading="lazy" src="${cover(id)}" onerror="this.style.display='none'"><span class="rank">${n?`#${n}`:'STEAM'}</span><button class="save ${saved?'saved':''}" onclick="event.stopPropagation();wish(${id})">${saved?'★':'☆'}</button></div><div class="body"><div class="title" title="${esc(a.name)}">${esc(a.name)}</div><div class="meta">${sale?`<span class="tag sale">-${p.discount_percent}%</span>`:''}<span class="tag">${esc((a.genres||[])[0]||'Steam game')}</span></div><div class="price">${p?esc(p.final_formatted):'Open for live details'}${p?.discount_percent?`<span class="old">${esc(p.initial_formatted)}</span>`:''}</div><div class="cardactions"><button class="btn" onclick="openGame(${id})">View</button><button class="btn" onclick="add(${id})">Add</button></div></div></article>`}
function top10(){let pool=S.apps.filter(a=>!S.q||a.name.toLowerCase().includes(S.q.toLowerCase()));let recent=S.viewed.map(id=>S.map.get(id)).filter(Boolean);let preferred=recent.flatMap(a=>a.genres||[]);if(preferred.length&&!S.q)pool.sort((a,b)=>score(b,preferred)-score(a,preferred));else pool.sort((a,b)=>score(b,[])-score(a,[]));return pool.slice(0,10)}
function score(a,genres){let d=S.details.get(a.steam_app_id),r=d?.recommendations?.total||0,m=d?.metacritic?.score||0,g=(a.genres||[]);return Math.log10(r+10)*10+m+(g.filter(x=>genres.includes(x)).length*30)+(a.name.length%7)}
function home(){let t=top10(),recent=S.viewed.map(id=>S.map.get(id)).filter(Boolean).slice(-6).reverse();return `<section class="hero"><div class="eyebrow">● Steam discovery engine</div><h1>Find your next game.<br><span style="color:#aa99ff">Actually.</span></h1><p>GamerGuy searches Steam, shows live game details, builds personal lists, tracks sales and learns what you browse.</p><div class="actions"><button class="btn primary" onclick="focusQ()">Search Steam</button><button class="btn" onclick="page('discover')">Explore categories</button></div></section><section class="section"><div class="head"><div><h2>Top 10 for your current vibe</h2><p>Personalized from searches and games you've opened.</p></div><span class="status"><i></i>${S.apps.length.toLocaleString()} loaded</span></div><div class="grid">${t.map((a,i)=>card(a,i+1)).join('')||'<div class="empty">Loading Steam catalog…</div>'}</div></section>${recent.length?`<section class="section"><div class="head"><div><h2>Because you viewed these</h2><p>GamerGuy uses this to improve recommendations.</p></div></div><div class="grid">${recent.map(a=>card(a)).join('')}</div></section>`:''}`}
function discover(){let genres=['Horror','Survival Horror','Indie','Action','Adventure','RPG','Strategy','Simulation','Racing','Co-op','Multiplayer','Single-player'],pool=S.apps.filter(a=>!S.q||a.name.toLowerCase().includes(S.q.toLowerCase()));return `<section><div class="head"><div><h2>Discover</h2><p>Pick a category, then GamerGuy ranks the best games it knows.</p></div></div><div class="chips">${genres.map(g=>`<button class="chip ${S.q.toLowerCase()===g.toLowerCase()?'on':''}" onclick="pick('${g}')">${g}</button>`).join('')}</div><div class="bar"><span>${pool.length.toLocaleString()} matching loaded games</span><button class="btn" onclick="load()">Load more</button></div><div class="grid">${pool.slice(0,80).map(a=>card(a)).join('')||'<div class="empty">No match yet. GamerGuy will keep paging through Steam when you search.</div>'}</div></section>`}
function lists(){return `<section><div class="head"><div><h2>My Lists</h2><p>Your personal game collections.</p></div><button class="btn primary" onclick="newList()">New list</button></div>${Object.entries(S.lists).map(([n,ids])=>`<section class="section"><div class="head"><div><h2>${esc(n)}</h2><p>${ids.length} games</p></div></div><div class="grid">${ids.map(id=>S.map.get(id)).filter(Boolean).map(a=>card(a)).join('')||'<div class="empty">Empty list.</div>'}</div></section>`).join('')||'<div class="empty">Create a list and start collecting games.</div>'}</section>`}
function wishlist(){let g=S.wish.map(id=>S.map.get(id)).filter(Boolean);return `<section><div class="head"><div><h2>Wishlist</h2><p>Games you want to watch.</p></div></div>${g.length?`<div class="grid">${g.map(a=>card(a)).join('')}</div>`:'<div class="empty">Nothing here yet. Hit ☆ on a game.</div>'}</section>`}
function alerts(){let g=Object.keys(S.watch).map(Number).map(id=>S.map.get(id)).filter(Boolean);return `<section><div class="head"><div><h2>Alerts</h2><p>Sale and store-change monitoring.</p></div><button class="btn green" onclick="notifyPermission()">Enable browser alerts</button></div><div class="empty">Browser notifications work while GamerGuy is open. True background alerts will need a server scheduler connected to Supabase.</div>${g.map(a=>`<div class="listrow"><div class="grow"><b>${esc(a.name)}</b><br><span class="muted">Watching sale changes</span></div><button class="btn" onclick="openGame(${a.steam_app_id})">Open</button></div>`).join('')}</section>`}
function render(){let html=S.page==='home'?home():S.page==='discover'?discover():S.page==='lists'?lists():S.page==='wishlist'?wishlist():alerts();$('#view').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===S.page))}
function page(p){S.page=p;render();scrollTo({top:0,behavior:'smooth'})}function focusQ(){$('#q').focus()}
function pick(g){S.q=g;$('#q').value=g;page('discover');searchMore()}
let timer;async function searchMore(){clearTimeout(timer);timer=setTimeout(async()=>{if(!S.q)return;try{while(!S.apps.some(a=>a.name.toLowerCase().includes(S.q.toLowerCase()))&&S.more&&!S.loading)await load()}catch(e){toast(e.message)}render()},250)}
function wish(id){S.wish=S.wish.includes(id)?S.wish.filter(x=>x!==id):[...S.wish,id];save();toast(S.wish.includes(id)?'Added to wishlist':'Removed from wishlist');render()}
function add(id){let ns=Object.keys(S.lists);if(!ns.length){newList();return}$('#choices').innerHTML=ns.map(n=>`<button class="listrow" onclick="addTo('${esc(n)}',${id})"><span class="grow"><b>${esc(n)}</b><br><small class="muted">${S.lists[n].length} games</small></span>+</button>`).join('');$('#modal').classList.add('open')}
function addTo(n,id){if(!S.lists[n].includes(id))S.lists[n].push(id);save();$('#modal').classList.remove('open');toast('Added to '+n)}
function newList(){let n=prompt('Name your new list:','My games');if(!n)return;if(!S.lists[n])S.lists[n]=[];save();render();toast('List created')}
async function openGame(id){let a=S.map.get(id);if(!a)return;if(!S.viewed.includes(id))S.viewed.push(id);save();$('#overlay').classList.add('open');$('#detail').innerHTML='<div class="detailhero"></div>';let d=await info(id);if(!d){$('#detail').innerHTML='<div class="detailhero"><img src="'+cover(id)+'"></div><div class="detail"><h2>'+esc(a.name)+'</h2><p class="muted">Steam details unavailable.</p></div>';return}let p=d.price_overview,sale=p?.discount_percent>0,free=d.is_free,demo=!!d.demos?.length||free,watch=!!S.watch[id],genres=(d.genres||[]).map(x=>x.description);$('#detail').innerHTML=`<div class="detailhero"><img src="${esc(d.header_image||cover(id))}"></div><div class="detail"><h2>${esc(d.name)}</h2><div class="muted">${esc((d.developers||[]).join(', '))}${d.release_date?.date?' · '+esc(d.release_date.date):''}</div><div class="features">${sale?`<span class="feature sale">Sale · ${p.discount_percent}% off</span>`:'<span class="feature">No active sale detected</span>'}${demo?`<span class="feature good">${free?'Free to play':'Demo available'}</span>`:''}${d.metacritic?`<span class="feature">Metacritic ${d.metacritic.score}</span>`:''}${genres.map(g=>`<span class="feature">${esc(g)}</span>`).join('')}</div><div class="stats"><div class="stat"><b>${esc(p?.final_formatted||'See Steam')}</b><small>Current price</small></div><div class="stat"><b>${sale?p.discount_percent+'%':'—'}</b><small>Discount</small></div><div class="stat"><b>${(d.recommendations?.total||0).toLocaleString()||'—'}</b><small>Steam recommendations</small></div></div><p class="muted">${esc((d.short_description||'').replace(/<[^>]*>/g,''))}</p><div class="actions"><a class="btn primary" target="_blank" href="https://store.steampowered.com/app/${id}/">Open Steam</a><button class="btn" onclick="add(${id})">Add to list</button><button class="btn ${watch?'green':''}" onclick="toggleWatch(${id})">${watch?'Watching alerts':'Watch alerts'}</button></div></div>`}
function toggleWatch(id){if(S.watch[id])delete S.watch[id];else S.watch[id]={sale:null,last:0};save();toast(S.watch[id]?'Alerts enabled':'Alerts disabled');openGame(id)}
async function notifyPermission(){if(!('Notification'in window)){toast('Notifications are not supported here');return}let p=await Notification.requestPermission();toast(p==='granted'?'Browser alerts enabled':'Permission not granted')}
async function check(){if(!Object.keys(S.watch).length)return;for(let id of Object.keys(S.watch)){let d=await info(+id);if(!d)continue;let now=d.price_overview?.discount_percent||0,old=S.watch[id].sale;if(old!==null&&now>old&&Notification.permission==='granted')new Notification(d.name,{body:`Now ${now}% off on Steam.`});S.watch[id].sale=now;S.watch[id].last=Date.now()}save()}
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();S.page='discover';render();searchMore()});document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)page(b.dataset.page)});$('#my').onclick=()=>page('lists');$('#bell').onclick=notifyPermission;$('#x').onclick=()=>$('#overlay').classList.remove('open');$('#overlay').onclick=e=>{if(e.target.id==='overlay')$('#overlay').classList.remove('open')};$('#mx').onclick=()=>$('#modal').classList.remove('open');$('#new').onclick=newList;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();focusQ()}if(e.key==='Escape'){$('#overlay').classList.remove('open');$('#modal').classList.remove('open')}});window.page=page;window.pick=pick;window.load=load;window.openGame=openGame;window.wish=wish;window.add=add;window.addTo=addTo;window.newList=newList;window.toggleWatch=toggleWatch;window.notifyPermission=notifyPermission;

/* ===== GamerGuy v3 feature patch ===== */
S.selectedGenres=JSON.parse(localStorage.ggSelectedGenres||'[]');
S.hidden=new Set(JSON.parse(localStorage.ggHidden||'[]'));
S.owned=new Set(JSON.parse(localStorage.ggOwned||'[]'));
S.ratings=JSON.parse(localStorage.ggRatings||'{}');
S.prefs=Object.assign({preferredGenres:[],avoidGenres:[],maxPrice:100,minScore:0,preferSingle:false,preferIndie:false,avoidEarly:false,notifySale:true,notifyUpdate:true,autoWatchSale:true,autoWatchUpdate:true},JSON.parse(localStorage.ggPrefs||'{}'));

function ggSave(){save();localStorage.ggSelectedGenres=JSON.stringify(S.selectedGenres);localStorage.ggHidden=JSON.stringify([...S.hidden]);localStorage.ggOwned=JSON.stringify([...S.owned]);localStorage.ggRatings=JSON.stringify(S.ratings);localStorage.ggPrefs=JSON.stringify(S.prefs)};

function ggIcon(name){const p={search:'<circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/>',home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-6h6v6"/>',discover:'<circle cx="12" cy="12" r="8"/><path d="m15 9-2 4-4 2 2-4z"/>',list:'<path d="M5 6h14M5 12h14M5 18h14"/>',heart:'<path d="M20.8 8.8c0 5-8.8 10.2-8.8 10.2S3.2 13.8 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7z"/>',bell:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 15.5 21 17l-2 2-1.5-2M4 8.5 2 7l2-2 1.5 2M8.5 4 7 2l2-2 1.5 2M15.5 20 17 22l-2 2-1.5-2"/>',eyeoff:'<path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.5 10.5 0 0 1 12 4c5.5 0 9.5 4.9 10 8-.2 1.1-.9 2.2-1.7 3.2M6.2 6.2C4.3 7.5 2.8 9.5 2 12c.5 3.1 4.5 8 10 8 1.5 0 2.8-.3 4-.8"/>',check:'<path d="m5 12 4 4L19 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>'};return `<svg class="ico" viewBox="0 0 24 24">${p[name]||p.discover}</svg>`}

function ggGenres(a){const d=S.details.get(a.steam_app_id);return [...new Set((d?.genres||[]).map(x=>x.description).concat(a.genres||[]))]}
function ggMatches(a){if(S.hidden.has(a.steam_app_id))return false;const q=S.q.toLowerCase();if(q&&!a.name.toLowerCase().includes(q))return false;const gs=ggGenres(a).map(x=>x.toLowerCase());if(S.selectedGenres.length&&!S.selectedGenres.every(g=>gs.includes(g.toLowerCase())))return false;const d=S.details.get(a.steam_app_id);if(d){if(S.prefs.avoidGenres.some(g=>gs.includes(g.toLowerCase())))return false;if(S.prefs.maxPrice<100&&(d.price_overview?.final||0)>S.prefs.maxPrice*100)return false;if(S.prefs.minScore>0&&(d.metacritic?.score||0)<S.prefs.minScore)return false;if(S.prefs.avoidEarly&&d.is_early_access)return false}return true}
function ggScore(a){const d=S.details.get(a.steam_app_id),gs=ggGenres(a).map(x=>x.toLowerCase());let n=(d?.metacritic?.score||0)*.7+Math.log10((d?.recommendations?.total||0)+10)*8;n+=S.prefs.preferredGenres.reduce((s,g)=>s+(gs.includes(g.toLowerCase())?30:0),0);if(S.prefs.preferSingle&&gs.includes('single-player'))n+=18;if(S.prefs.preferIndie&&gs.includes('indie'))n+=18;if(S.prefs.avoidEarly&&d?.is_early_access)n-=25;return n+(a.name.length%5)}
function ggCard(a,n,opt={}){const id=a.steam_app_id,d=S.details.get(id),p=d?.price_overview,sale=p?.discount_percent>0,saved=S.wish.includes(id),owned=S.owned.has(id),rating=S.ratings[id]||0;return `<article class="card"><div class="cover"><img loading="lazy" src="${cover(id)}" onerror="this.style.display='none'"><span class="rank">${n?`#${n}`:opt.recommend?'RECOMMENDED':''}</span><button class="save ${saved?'saved':''}" title="${saved?'Remove from wishlist':'Add to wishlist'}" onclick="event.stopPropagation();wish(${id})">${ggIcon('star')}</button></div><div class="body"><div class="title" title="${esc(a.name)}">${esc(a.name)}</div><div class="meta">${sale?`<span class="tag sale">-${p.discount_percent}%</span>`:''}${ggGenres(a).slice(0,2).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div><div class="price">${p?esc(p.final_formatted):d?.is_free?'Free':'Open for details'}${p?.discount_percent?`<span class="old">${esc(p.initial_formatted)}</span>`:''}</div>${rating?`<div class="personal">${ggIcon('star')} Your rating ${rating}/5</div>`:''}<div class="cardactions"><button class="btn" onclick="openGame(${id})">View</button>${opt.recommend&&!owned?`<button class="btn" onclick="markOwned(${id})">I already own this</button>`:`<button class="btn" onclick="add(${id})">Add</button>`}</div><button class="quiet" onclick="hideGame(${id})">${ggIcon('eyeoff')} Never show again</button></div></article>`}
async function ggEnsureGenres(){if(!S.selectedGenres.length)return;const candidates=S.apps.filter(a=>!S.hidden.has(a.steam_app_id)&&(!S.q||a.name.toLowerCase().includes(S.q.toLowerCase()))).slice(0,100);S.filterBusy=true;render();for(let i=0;i<candidates.length;i+=8)await Promise.all(candidates.slice(i,i+8).map(a=>info(a.steam_app_id)));S.filterBusy=false;render()}
async function load(){if(S.loading||!S.more)return false;S.loading=true;render();try{const d=await edge('get_app_page');let added=0;(d.apps||[]).forEach(a=>{if(!a.steam_app_id||!a.name||S.map.has(a.steam_app_id))return;S.map.set(a.steam_app_id,a);S.apps.push(a);added++});const next=d.next_last_appid||d.last_appid||S.cursor;if(next===S.cursor&&!d.has_more_results)S.more=false;else S.cursor=next;S.more=!!d.has_more_results;$('#status').textContent=`Steam online · ${S.apps.length.toLocaleString()} games loaded`;S.loading=false;render();return added}catch(e){S.loading=false;$('#status').textContent='Steam connection error';toast(e.message);render();return 0}}
function loadMore(){if(!S.more){toast('All loaded Steam catalog data is already here');return}load().then(()=>S.selectedGenres.length&&ggEnsureGenres())}
function ggTop(pool){return [...pool].sort((a,b)=>ggScore(b)-ggScore(a)).slice(0,10)}
function home(){const pool=S.apps.filter(ggMatches);const rec=ggTop(pool.length?pool:S.apps.filter(a=>!S.hidden.has(a.steam_app_id))).filter(a=>!S.owned.has(a.steam_app_id));const recent=S.viewed.map(id=>S.map.get(id)).filter(a=>a&&!S.hidden.has(a.steam_app_id)).slice(-6).reverse();return `<section class="hero"><div class="eyebrow">GAMER DISCOVERY</div><h1>Find games that fit.</h1><p>Search Steam, combine genres, tune your taste, and build a library that actually feels personal.</p><div class="actions"><button class="btn primary" onclick="focusQ()">${ggIcon('search')} Search Steam</button><button class="btn" onclick="page('discover')">${ggIcon('discover')} Discover</button></div></section><section class="section"><div class="head"><div><h2>Top 10 for you</h2><p>Based on your browsing, preferences, ratings and filters.</p></div><span class="status"><i></i>${S.apps.length.toLocaleString()} loaded</span></div><div class="grid">${rec.map((a,i)=>ggCard(a,i+1,{recommend:true})).join('')||'<div class="empty">Browse or search a few games and GamerGuy will build your recommendations.</div>'}</div></section>${recent.length?`<section class="section"><div class="head"><div><h2>Recently viewed</h2><p>Recent games help tune your recommendations.</p></div></div><div class="grid">${recent.map(a=>ggCard(a)).join('')}</div></section>`:''}`}
function discover(){const pool=S.apps.filter(ggMatches),ranked=ggTop(pool);return `<section><div class="head compact"><div><h2>Discover</h2><p>${S.q?`Results for “${esc(S.q)}”`:'Search the Steam catalog'}${S.selectedGenres.length?` · ${S.selectedGenres.length} genre filters`:''}</p></div><button class="btn" onclick="loadMore()">${S.loading?'Loading…':S.more?'Load more':'Catalog loaded'}</button></div><div class="searchtools"><div class="queryline">${S.q?`<span class="querypill">${esc(S.q)} <button onclick="clearSearch()">${ggIcon('close')}</button></span>`:'Use the genre filters below to narrow the search.'}</div><div class="filterbar"><div><b>Genres</b><span class="filterhint">Select multiple</span></div><button class="btn" onclick="clearFilters()">Clear</button></div><div class="chips">${['Horror','Survival Horror','Indie','Action','Adventure','RPG','Strategy','Simulation','Racing','Co-op','Multiplayer','Single-player','Story Rich','Psychological Horror','Survival'].map(g=>`<button class="chip ${S.selectedGenres.includes(g)?'on':''}" onclick="toggleGenre('${g}')">${g}</button>`).join('')}</div></div>${S.filterBusy?'<div class="empty">Checking Steam genre data for matching games…</div>':''}<section class="section top10box"><div class="head"><div><h3>Top 10 matching your filters</h3><p>Best games matching every selected genre.</p></div></div><div class="grid">${ranked.map((a,i)=>ggCard(a,i+1,{recommend:true})).join('')||'<div class="empty">No matching games loaded yet. Try fewer filters or load more.</div>'}</div></section><div class="bar"><span>${pool.length.toLocaleString()} matching loaded${S.more?' · more available':''}</span><button class="btn" onclick="loadMore()">${S.more?'Load more games':'All loaded'}</button></div><div class="grid">${pool.slice(0,100).map(a=>ggCard(a)).join('')||'<div class="empty">No matches in the loaded catalog.</div>'}</div></section>`}
function wishlist(){const g=S.wish.map(id=>S.map.get(id)).filter(a=>a&&!S.hidden.has(a.steam_app_id));return `<section><div class="head"><div><h2>Wishlist</h2><p>Starred games can automatically watch sales and updates.</p></div></div>${g.length?`<div class="grid">${g.map(a=>ggCard(a)).join('')}</div>`:'<div class="empty">Your wishlist is empty.</div>'}</section>`}
function alerts(){const g=Object.keys(S.watch).map(Number).map(id=>S.map.get(id)).filter(Boolean);return `<section><div class="head"><div><h2>Alerts</h2><p>Control what happens when your watched games change.</p></div><button class="btn green" onclick="notifyPermission()">${ggIcon('bell')} Enable notifications</button></div><div class="settinggrid"><div class="setting"><b>Sale alerts</b><span>Notify when a watched game gets discounted.</span><label class="switch"><input type="checkbox" ${S.prefs.notifySale?'checked':''} onchange="setPref('notifySale',this.checked)"><span></span></label></div><div class="setting"><b>Update alerts</b><span>Notify when new Steam news/update activity appears.</span><label class="switch"><input type="checkbox" ${S.prefs.notifyUpdate?'checked':''} onchange="setPref('notifyUpdate',this.checked)"><span></span></label></div></div>${g.map(a=>`<div class="listrow"><div class="grow"><b>${esc(a.name)}</b><br><span class="muted">Watching ${S.watch[a.steam_app_id]?.sale!==null?'sales':''}${S.watch[a.steam_app_id]?.update?' and updates':''}</span></div><button class="btn" onclick="openGame(${a.steam_app_id})">Open</button></div>`).join('')}</section>`}
function settings(){const G=['Action','Adventure','Casual','Co-op','Early Access','Free to Play','Horror','Indie','Multiplayer','RPG','Racing','Simulation','Single-player','Sports','Strategy','Survival','Survival Horror','Story Rich','Psychological Horror'];return `<section><div class="head"><div><h2>Settings</h2><p>Tell GamerGuy what you like and what you want to be notified about.</p></div></div><div class="settings"><div class="panel"><h3>Recommendation taste</h3><p class="muted">Preferred genres receive a stronger recommendation score.</p><label>Preferred genres</label><div class="chips smallchips">${G.map(g=>`<button class="chip ${S.prefs.preferredGenres.includes(g)?'on':''}" onclick="togglePrefGenre('preferredGenres','${g}')">${g}</button>`).join('')}</div><label>Avoid genres</label><div class="chips smallchips">${G.map(g=>`<button class="chip dangerchip ${S.prefs.avoidGenres.includes(g)?'on':''}" onclick="togglePrefGenre('avoidGenres','${g}')">${g}</button>`).join('')}</div><div class="settingrow"><span>Maximum price (USD)</span><input class="num" type="number" min="0" value="${S.prefs.maxPrice}" onchange="setPref('maxPrice',Number(this.value)||0)"></div><div class="settingrow"><span>Minimum Metacritic score</span><input class="num" type="number" min="0" max="100" value="${S.prefs.minScore}" onchange="setPref('minScore',Number(this.value)||0)"></div><div class="checks"><label><input type="checkbox" ${S.prefs.preferSingle?'checked':''} onchange="setPref('preferSingle',this.checked)"> Prefer single-player</label><label><input type="checkbox" ${S.prefs.preferIndie?'checked':''} onchange="setPref('preferIndie',this.checked)"> Prefer indie</label><label><input type="checkbox" ${S.prefs.avoidEarly?'checked':''} onchange="setPref('avoidEarly',this.checked)"> Avoid early access</label></div></div><div class="panel"><h3>Wishlist & notifications</h3><p class="muted">Choose what a star means for you.</p><div class="settingrow"><span>Auto-watch sales</span><label class="switch"><input type="checkbox" ${S.prefs.autoWatchSale?'checked':''} onchange="setPref('autoWatchSale',this.checked)"><span></span></label></div><div class="settingrow"><span>Auto-watch updates</span><label class="switch"><input type="checkbox" ${S.prefs.autoWatchUpdate?'checked':''} onchange="setPref('autoWatchUpdate',this.checked)"><span></span></label></div><div class="settingrow"><span>Sale notifications</span><label class="switch"><input type="checkbox" ${S.prefs.notifySale?'checked':''} onchange="setPref('notifySale',this.checked)"><span></span></label></div><div class="settingrow"><span>Update notifications</span><label class="switch"><input type="checkbox" ${S.prefs.notifyUpdate?'checked':''} onchange="setPref('notifyUpdate',this.checked)"><span></span></label></div></div><div class="panel"><h3>Browser data</h3><p class="muted">Your hidden games, owned games, ratings and taste are stored locally for now.</p><div class="actions"><button class="btn" onclick="resetTaste()">Reset taste</button><button class="btn" onclick="clearHistory()">Clear browsing history</button></div></div></div></section>`}
function lists(){return `<section><div class="head"><div><h2>My Lists</h2><p>Your personal collections.</p></div><button class="btn primary" onclick="newList()">${ggIcon('plus')} New list</button></div>${Object.entries(S.lists).map(([n,ids])=>`<section class="section"><div class="head"><div><h2>${esc(n)}</h2><p>${ids.length} games</p></div></div><div class="grid">${ids.map(id=>S.map.get(id)).filter(Boolean).map(a=>ggCard(a)).join('')||'<div class="empty">Empty list.</div>'}</div></section>`).join('')||'<div class="empty">Create a list and start collecting games.</div>'}</section>`}
function render(){const html=S.page==='home'?home():S.page==='discover'?discover():S.page==='lists'?lists():S.page==='wishlist'?wishlist():S.page==='alerts'?alerts():settings();$('#view').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===S.page))}
function clearSearch(){S.q='';$('#q').value='';render()}
function clearFilters(){S.selectedGenres=[];ggSave();render()}
function toggleGenre(g){S.selectedGenres=S.selectedGenres.includes(g)?S.selectedGenres.filter(x=>x!==g):[...S.selectedGenres,g];ggSave();render();ggEnsureGenres()}
function wish(id){const adding=!S.wish.includes(id);if(adding){S.wish=[...S.wish,id];if(S.prefs.autoWatchSale||S.prefs.autoWatchUpdate)S.watch[id]={sale:null,update:S.prefs.autoWatchUpdate,lastNews:null};toast('Added to wishlist')}else{S.wish=S.wish.filter(x=>x!==id);delete S.watch[id];toast('Removed from wishlist')}ggSave();render()}
function hideGame(id){S.hidden.add(id);S.wish=S.wish.filter(x=>x!==id);delete S.watch[id];ggSave();$('#overlay').classList.remove('open');toast('Game hidden from GamerGuy');render()}
function markOwned(id){S.owned.add(id);ggSave();toast('Marked as owned. It will stay in search results but leave recommendations.');render()}
function rate(id,n){S.ratings[id]=n;ggSave();toast(`Your rating: ${n}/5`);render();openGame(id)}
function setPref(k,v){S.prefs[k]=v;ggSave();render()}
function togglePrefGenre(group,g){S.prefs[group]=S.prefs[group].includes(g)?S.prefs[group].filter(x=>x!==g):[...S.prefs[group],g];ggSave();render()}
function resetTaste(){S.prefs.preferredGenres=[];S.prefs.avoidGenres=[];S.prefs.maxPrice=100;S.prefs.minScore=0;S.prefs.preferSingle=false;S.prefs.preferIndie=false;S.prefs.avoidEarly=false;ggSave();render();toast('Recommendation taste reset')}
function clearHistory(){S.viewed=[];ggSave();render();toast('Browsing history cleared')}
async function ggReviews(id){try{const r=await fetch(`${REVIEWS}${id}?json=1&language=english&filter=recent&num_per_page=3&purchase_type=all`);return await r.json()}catch{return null}}
async function ggNews(id){try{const r=await fetch(`${NEWS}?appid=${id}&count=5&maxlength=1`);return (await r.json())?.appnews?.newsitems||[]}catch{return []}}
async function openGame(id){const a=S.map.get(id);if(!a)return;if(!S.viewed.includes(id))S.viewed.push(id);ggSave();$('#overlay').classList.add('open');$('#detail').innerHTML='<div class="loadingdetail">Loading game analysis and reviews…</div>';const [d,rv,nw]=await Promise.all([info(id),ggReviews(id),ggNews(id)]);if(!d){$('#detail').innerHTML=`<div class="detail"><h2>${esc(a.name)}</h2><p class="muted">Steam details unavailable.</p></div>`;return}const p=d.price_overview,sale=p?.discount_percent>0,free=d.is_free,demo=!!d.demos?.length,watch=!!S.watch[id],genres=(d.genres||[]).map(x=>x.description),rating=S.ratings[id]||0,sum=rv?.query_summary,total=(sum?.total_positive||0)+(sum?.total_negative||0),pct=total?Math.round((sum.total_positive/total)*100):null,fit=Math.max(0,Math.min(100,Math.round(ggScore(a))));const analysis=[sale?'Currently discounted on Steam.':free?'Free to play.':p?'No active sale detected right now.':'Price unavailable.',d.metacritic?.score>=80?'Strong critic reception.':d.metacritic?.score>=65?'Mixed-to-positive critic reception.':d.metacritic?'Mixed critic reception.':'No Metacritic score available.',pct>=85?'Very positive recent Steam sentiment.':pct>=70?'Mostly positive Steam sentiment.':pct!==null?'Mixed Steam sentiment.':'Steam review summary unavailable.'];$('#detail').innerHTML=`<div class="detailhero"><img src="${esc(d.header_image||cover(id))}"></div><div class="detail"><div class="eyebrow">GAME ANALYSIS</div><h2>${esc(d.name)}</h2><div class="muted">${esc((d.developers||[]).join(', '))}${d.release_date?.date?' · '+esc(d.release_date.date):''}</div><div class="features">${sale?`<span class="feature sale">Sale · ${p.discount_percent}% off</span>`:''}${free?'<span class="feature good">Free to play</span>':''}${demo?'<span class="feature good">Demo available</span>':''}${d.metacritic?`<span class="feature">Metacritic ${d.metacritic.score}</span>`:''}${genres.map(g=>`<span class="feature">${esc(g)}</span>`).join('')}</div><div class="stats"><div class="stat"><b>${esc(p?.final_formatted||'See Steam')}</b><small>Current price</small></div><div class="stat"><b>${sale?p.discount_percent+'%':'—'}</b><small>Discount</small></div><div class="stat"><b>${fit}/100</b><small>GamerGuy fit</small></div></div><div class="analysis"><h3>GamerGuy analysis</h3>${analysis.map(x=>`<div class="analysisline">${ggIcon('check')}<span>${esc(x)}</span></div>`).join('')}</div><div class="reviews"><div class="head"><div><h3>Steam reviews</h3><p>${sum?`${esc(sum.review_score_desc||'')} · ${total.toLocaleString()} votes in the summary`:'Review data unavailable'}</p></div>${pct!==null?`<strong>${pct}% positive</strong>`:''}</div>${rv?.reviews?.length?rv.reviews.map(r=>`<article class="review"><div class="reviewtop"><b>${r.voted_up?'Positive':'Negative'}</b><span>${new Date((r.timestamp_created||0)*1000).toLocaleDateString()}</span></div><p>${esc((r.review||'').slice(0,320))}${(r.review||'').length>320?'…':''}</p></article>`).join(''):'<div class="empty">Steam did not return recent review text.</div>'}</div><div class="personalrate"><h3>Your rating</h3><div class="stars">${[1,2,3,4,5].map(n=>`<button class="rate ${rating>=n?'on':''}" onclick="rate(${id},${n})">${ggIcon('star')}</button>`).join('')}</div></div><div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="https://store.steampowered.com/app/${id}/">Open Steam</a><button class="btn" onclick="add(${id})">${ggIcon('plus')} Add to list</button><button class="btn ${watch?'green':''}" onclick="toggleWatch(${id})">${watch?ggIcon('bell')+' Watching':'Watch alerts'}</button><button class="btn" onclick="hideGame(${id})">${ggIcon('eyeoff')} Never show again</button></div></div>`}
function toggleWatch(id){if(S.watch[id])delete S.watch[id];else S.watch[id]={sale:null,update:true,lastNews:null};ggSave();toast(S.watch[id]?'Alerts enabled':'Alerts disabled');openGame(id)}
async function notifyPermission(){if(!('Notification'in window)){toast('Browser notifications are not supported here');return}const p=await Notification.requestPermission();toast(p==='granted'?'Browser alerts enabled':'Notification permission was not granted')}
async function check(){if(!Object.keys(S.watch).length)return;for(const id of Object.keys(S.watch)){const d=await info(+id),w=S.watch[id];if(!d)continue;const now=d.price_overview?.discount_percent||0;if(S.prefs.notifySale&&w.sale!==null&&now>w.sale&&Notification.permission==='granted')new Notification(d.name,{body:`Now ${now}% off on Steam.`});w.sale=now;const news=await ggNews(+id),newest=news[0]?.gid||null;if(S.prefs.notifyUpdate&&w.lastNews&&newest&&newest!==w.lastNews&&Notification.permission==='granted')new Notification(d.name,{body:'New Steam update/news activity detected.'});if(newest)w.lastNews=newest}save()}
let searchTimer;searchMore=async function(){clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{if(!S.q){render();return}let tries=0;while(!S.apps.some(a=>a.name.toLowerCase().includes(S.q.toLowerCase()))&&S.more&&!S.loading&&tries<6){await load();tries++}if(S.selectedGenres.length)await ggEnsureGenres();render()},250)};
window.loadMore=loadMore;window.clearSearch=clearSearch;window.clearFilters=clearFilters;window.toggleGenre=toggleGenre;window.hideGame=hideGame;window.markOwned=markOwned;window.rate=rate;window.setPref=setPref;window.togglePrefGenre=togglePrefGenre;window.resetTaste=resetTaste;window.clearHistory=clearHistory;

render();load();setInterval(check,15*60*1000);
</script></body></html>
